# ==============================================================================
# Workload 1: CUDA VectorAdd Sanity Check Pod
# Verifies that CUDA kernels can be compiled and executed on the scheduled GPU
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: cuda-vectoradd-sanity
  labels:
    app: cuda-sanity
spec:
  restartPolicy: OnFailure
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: cuda-vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1-ubuntu20.04
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
