apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-service-monitor
  namespace: llm-serving
  labels:
    app: vllm-inference-engine
    openshift.io/user-monitoring: "true"
spec:
  selector:
    matchLabels:
      app: vllm-inference-engine
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    scheme: http
