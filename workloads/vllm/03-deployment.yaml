apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-engine
  namespace: llm-serving
  labels:
    app: vllm-inference-engine
    ai.openshift.io/workload: "llm"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-inference-engine
  template:
    metadata:
      labels:
        app: vllm-inference-engine
    spec:
      serviceAccountName: vllm-sa
      securityContext:
        runAsUser: 0
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsUser: 0
        command:
        - vllm
        - serve
        args:
        - Qwen/Qwen2.5-3B-Instruct
        - --max-model-len
        - "4096"
        - --gpu-memory-utilization
        - "0.85"
        - --enforce-eager
        - --port
        - "8000"
        - --trust-remote-code
        env:
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: VLLM_USAGE_SOURCE
          value: openshift-ai-infrastructure
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 16Gi
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: 8Gi
            cpu: "2"
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: vllm-model-cache-pvc
      - name: dshm
        emptyDir:
          medium: Memory
