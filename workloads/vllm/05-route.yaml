apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-route
  namespace: llm-serving
  labels:
    app: vllm-inference-engine
spec:
  to:
    kind: Service
    name: vllm-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
