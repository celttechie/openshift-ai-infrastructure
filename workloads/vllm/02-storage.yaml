apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-model-cache-pv
  labels:
    type: local-model-cache
spec:
  storageClassName: manual
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/mnt/models
    type: DirectoryOrCreate
  claimRef:
    namespace: llm-serving
    name: vllm-model-cache-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache-pvc
  namespace: llm-serving
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
