apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-model-registry
  namespace: llm-serving
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    openshift.io/display-name: "Enterprise S3 Model Registry"
    opendatahub.io/connection-type: "s3"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "model-serving-readonly"
  AWS_SECRET_ACCESS_KEY: "CHANGEME_ENTERPRISE_SECRET_KEY"
  AWS_S3_ENDPOINT: "https://s3.internal.domain.local:9000"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_BUCKET: "enterprise-foundation-models"
