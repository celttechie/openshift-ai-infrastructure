# ==============================================================================
# NVIDIA GPU Operator - ClusterPolicy Custom Resource
# Configures driver, container-toolkit, device-plugin, DCGM, and time-slicing
# ==============================================================================
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  operator:
    defaultRuntime: crio
  driver:
    enabled: true
    useHostDriver: false
  toolkit:
    enabled: true
  devicePlugin:
    enabled: true
    config:
      name: time-slicing-config
      default: any
  gfd:
    enabled: true
  # DCGM is disabled by default for homelab compatibility (UBI10 dcgm image requires x86-64-v3 / AVX2; enable for enterprise/modern CPUs)
  dcgm:
    enabled: false
  dcgmExporter:
    enabled: false
  mig:
    strategy: single
  nodeStatusExporter:
    enabled: true
  daemonsets:
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
