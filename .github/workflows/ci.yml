name: CI / Manifest & Infrastructure Testing

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint, Unit Test & Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint YAML Manifests (yamllint)
        run: |
          yamllint -c .yamllint.yml operators/ workloads/

      - name: Lint Python Code (flake8)
        run: |
          flake8 targets/ tests/

      - name: Lint Shell Scripts (shellcheck)
        run: |
          shellcheck scripts/*.sh

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Validate Kustomize Manifest Builds
        run: |
          kubectl kustomize workloads/vllm > /dev/null
          kubectl kustomize workloads/rhoai-kserve > /dev/null

      - name: Run Python Unit Tests & Policy Guardrails (pytest)
        run: |
          pytest tests/ -v --tb=short

      - name: Validate Kubernetes Schemas (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          # Validate compiled kustomize manifests, ignoring cluster-specific CRDs (Routes, SCCs)
          kubectl kustomize workloads/vllm | kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.30.0
